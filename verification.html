  <div id="__APP">
    <style>
      :root {
        --bg: #181a20;
        --bg-2: #0b0e11;
        --card: #1e232c;
        --card-2: #202630;
        --input: rgba(41, 49, 61, 0.9);
        --line: rgba(255, 255, 255, 0.08);
        --text: #eaecef;
        --muted: #929aa5;
        --soft: #707a8a;
        --yellow: #f0b90b;
        --yellow-strong: #fcd535;
        --green: #2ebd85;
        --red: #f6465d;
        --shadow: rgba(0, 0, 0, 0.32);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: BinanceNova, Arial, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow-x: hidden;
      }

      .page-shell {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 16px;
      }

      .verification-card {
        width: min(100%, 640px);
        background: rgba(18, 21, 27, 0.98);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.32);
        padding: 32px 28px 28px;
      }

      .brand-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 28px;
      }

      .brand-icon {
        width: 120px;
        height: 28px;
        display: block;
      }

      .title {
        margin: 0 0 26px;
        text-align: center;
        font-size: clamp(2.1rem, 4vw, 4rem);
        line-height: 1.1;
        letter-spacing: -0.05em;
        font-weight: 700;
        color: #f2f3f5;
      }

      .hero-icon-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 24px;
      }

      .shield-icon {
        width: 168px;
        height: 150px;
      }

      .message {
        text-align: center;
        max-width: 500px;
        margin: 0 auto 28px;
      }

      .message-title {
        display: block;
        font-size: clamp(1.1rem, 1.8vw, 2.2rem);
        font-weight: 700;
        line-height: 1.35;
        letter-spacing: -0.03em;
        color: var(--text);
        margin-bottom: 10px;
      }

      .message-copy {
        font-size: clamp(0.98rem, 1.5vw, 1.2rem);
        line-height: 1.7;
        color: rgba(255,255,255,0.7);
        font-weight: 400;
      }

      .resend-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: min(100%, 440px);
        height: 60px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(240,185,11,0.42), rgba(240,185,11,0.2));
        color: #f7d77d;
        font-size: clamp(1.2rem, 2vw, 2rem);
        font-weight: 700;
        cursor: pointer;
        margin: 0 auto 24px;
        transition: transform 0.15s ease, filter 0.2s ease, opacity 0.25s ease;
      }

      .resend-btn:hover {
        filter: brightness(1.05);
      }

      .resend-btn:active {
        transform: translateY(1px);
      }

      .resend-btn:disabled {
        opacity: 0.9;
        cursor: default;
      }

      .other-method {
        display: block;
        text-align: center;
        color: var(--yellow);
        text-decoration: none;
        font-weight: 700;
        font-size: clamp(1.05rem, 1.6vw, 1.7rem);
        line-height: 1.4;
      }

      .other-method:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .verification-card {
          padding: 22px 18px 22px;
          border-radius: 18px;
        }

        .title {
          margin-bottom: 18px;
        }

        .shield-icon {
          width: 130px;
          height: 116px;
        }

        .message {
          margin-bottom: 22px;
        }

        .resend-btn {
          height: 54px;
          border-radius: 12px;
        }
      }
    </style>

    <script>
      const resendBtn = document.getElementById('resendBtn');
      let countdown = 13;
      let timerId = null;

      function updateButtonText() {
        resendBtn.textContent = `Resend (${countdown}s)`;
      }

      function startCountdown() {
        clearInterval(timerId);
        countdown = 13;
        updateButtonText();

        timerId = setInterval(() => {
          countdown -= 1;
          if (countdown <= 0) {
            clearInterval(timerId);
            resendBtn.textContent = 'Resend';
            resendBtn.disabled = false;
            return;
          }

          updateButtonText();
        }, 1000);
      }

      resendBtn.addEventListener('click', () => {
        if (countdown > 0) return;
        resendBtn.disabled = true;
        startCountdown();
      });

      resendBtn.disabled = true;
      startCountdown();
    </script>
